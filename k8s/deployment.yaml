
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-calculator
  template:
    metadata:
      labels:
        app: grade-calculator
    spec:
      containers:
        - name: grade-calculator
          image: siddeadskull11/student-grade-calculator:v1
          ports:
            - containerPort: 5000
